name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5

      - name: List available versions
        run: mise ls-remote "vfox:${{ github.repository }}" | head -20

      - name: Install and test 1password
        run: |
          mise install "vfox:${{ github.repository }}@2.30.0"
          mise exec "vfox:${{ github.repository }}@2.30.0" -- op --version
